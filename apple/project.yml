name: ProLineCRM
options:
  bundleIdPrefix: com.prolineroofingandsolar
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J87GB8M4RD
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ProLineCRM-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prolineroofingandsolar.crm.native
        INFOPLIST_FILE: Configuration/iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/ProLineCRM.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ProLineWidget-iOS
        embed: true
  ProLineCRM-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prolineroofingandsolar.crm.native.mac
        INFOPLIST_FILE: Configuration/macOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/ProLineCRM.entitlements
        PRODUCT_NAME: ProLine CRM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ProLineWidget-macOS
        embed: true
  ProLineWidget-iOS:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared/Models/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prolineroofingandsolar.crm.native.widget
        INFOPLIST_FILE: Configuration/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/ProLineCRM.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  ProLineWidget-macOS:
    type: app-extension
    platform: macOS
    sources:
      - Widgets
      - Shared/Models/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prolineroofingandsolar.crm.native.mac.widget
        INFOPLIST_FILE: Configuration/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/ProLineCRM.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  ProLineCRMTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: ProLineCRM-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prolineroofingandsolar.crm.native.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ProLine CRM.app/Contents/MacOS/ProLine CRM"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ProLineCRM-iOS:
    build:
      targets:
        ProLineCRM-iOS: all
    run:
      config: Debug
  ProLineCRM-macOS:
    build:
      targets:
        ProLineCRM-macOS: all
    run:
      config: Debug
    test:
      targets:
        - ProLineCRMTests
